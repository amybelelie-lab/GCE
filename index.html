const KI={folder:"📁",doc:"📄",sheet:"📊",slide:"🟨",pdf:"📕"};
const drive=()=>{const r=FS.dr,L=r.it.filter(i=>(r.nav=="Trash"?i.tr:!i.tr)&&(r.nav=="Starred"?i.s:r.nav=="Shared with me"?i.sh:true)&&i.n.toLowerCase().includes(r.q.toLowerCase()));
return `<div class="hd"><b>Drive</b><input class="sq" data-x="q" placeholder="Search in Drive" value="${E(r.q)}"><button data-x="vw">${r.v=="grid"?"☰ List":"▦ Grid"}</button></div><div class="gm"><div class="gs"><button class="p" data-x="new">＋ New</button>${["My Drive","Shared with me","Starred","Trash"].map(n=>`<button class="${r.nav==n?"sel":""}" data-x="nav" data-v="${n}">${n}</button>`).join("")}</div><div class="gl"><h3>${r.nav}</h3><div class="${r.v=="grid"?"grid":""}">${L.map(i=>`<div class="fl" style="${r.v=="grid"?"":"width:100%"}">${KI[i.k]} <span style="flex:1">${E(i.n)}</span>${i.tr?`<button data-x="rest" data-v="${i.id}">Restore</button><button data-x="purge" data-v="${i.id}">Delete forever</button>`:`<button class="ic" data-x="dstar" data-v="${i.id}">${i.s?"★":"☆"}</button><button class="ic" data-x="trash" data-v="${i.id}">🗑</button>`}</div>`).join("")||"<p class=mu>Nothing here.</p>"}</div></div></div>`+(r.nw?`<div class="dlg"><div><h3>New</h3><input id="nn" placeholder="Name"><div>${Object.keys(KI).slice(0,4).map(k=>`<button data-x="mk" data-v="${k}">${KI[k]} ${k}</button>`).join(" ")}</div><div class="r"><button data-x="nx">Cancel</button></div></div></div>`:"")};
H.Drive=(t,e,el)=>{const r=FS.dr,d=el.dataset,v=d.v;if(t=="input"&&d.x=="q"){r.q=el.value;rr(".sq");return}if(t!="click"||!d.x)return;const it=r.it.find(i=>i.id==v);
if(d.x=="nav")r.nav=v;else if(d.x=="vw")r.v=r.v=="grid"?"list":"grid";else if(d.x=="new")r.nw=1;else if(d.x=="nx")r.nw=0;else if(d.x=="mk"){r.it.push({id:Date.now(),n:$("#nn").value||"Untitled "+v,k:v});r.nw=0;r.nav="My Drive"}
else if(d.x=="dstar")it.s=!it.s;else if(d.x=="trash")it.tr=1;else if(d.x=="rest")it.tr=0;else if(d.x=="purge")r.it=r.it.filter(i=>i!=it);else return;rr()};
/* Slides: add, duplicate, delete, reorder by picking, edit text, backgrounds, present mode */
const SW=["#ffffff","#fce8b2","#d2e3fc","#ceead6","#fad2cf"];
const slides=()=>{const s=FS.sl,c=s.s[s.i];
return (s.p?`<div class="dlg" data-x="adv" style="background:#000;flex-direction:column;cursor:pointer"><div class="slide" style="background:${c.c};width:90%;max-width:900px;font-size:1.4em"><h1>${E(c.t)}</h1><p>${E(c.b)}</p></div><small style="color:#fff">${s.i+1}/${s.s.length} · click or use arrow keys · Esc to exit</small></div>`:"")+`<div class="hd"><b>Slides</b><button data-x="add">＋ New slide</button><button data-x="dup">⧉ Duplicate</button><button data-x="rem">🗑 Delete</button>${SW.map(k=>`<button class="ic" data-x="bg" data-v="${k}" style="background:${k}" aria-label="Background"></button>`).join("")}<span class="sp"></span><button class="p" data-x="pres">▶ Present</button></div><div class="gm"><div class="gs">${s.s.map((x,j)=>`<div class="fl ${j==s.i?"sel":""}" data-x="pick" data-v="${j}" style="background:${x.c};cursor:pointer"><small>${j+1}. ${E(x.t)}</small></div>`).join("")}</div><div class="gl"><div class="slide" style="background:${c.c}"><h2 contenteditable data-x="st">${E(c.t)}</h2><p contenteditable data-x="sb">${E(c.b)}</p></div></div></div>`};
H.Slides=(t,e,el)=>{const s=FS.sl,d=el.dataset,c=s.s[s.i];if(t=="input"){if(d.x=="st")c.t=el.innerText;if(d.x=="sb")c.b=el.innerText;return}if(t!="click"||!d.x)return;
if(d.x=="add"){s.s.splice(s.i+1,0,{t:"New slide",b:"Click to add text",c:"#ffffff"});s.i++}else if(d.x=="dup"){s.s.splice(s.i+1,0,{...c});s.i++}else if(d.x=="rem"&&s.s.length>1){s.s.splice(s.i,1);s.i=Math.max(0,s.i-1)}else if(d.x=="bg")c.c=d.v;else if(d.x=="pick")s.i=+d.v;else if(d.x=="pres")s.p=1;else if(d.x=="adv"){s.i<s.s.length-1?s.i++:s.p=0}else return;rr()};
document.addEventListener("keydown",e=>{const s=FS.sl;if(S.free=="Slides"&&s.p){if(e.key=="Escape")s.p=0;else if(e.key=="ArrowRight"||e.key==" ")s.i=Math.min(s.i+1,s.s.length-1);else if(e.key=="ArrowLeft")s.i=Math.max(0,s.i-1);else return;rr()}});
["click","change","input","focusin","focusout","keydown"].forEach(t=>fr.addEventListener(t,e=>{const h=H[S.free];h&&h(t,e,e.target.closest("[data-x]")||e.target)}));
const FA={Docs:["📄",docs],Sheets:["▦",sheets],Gmail:["✉",gmail],Calendar:["📅",cal],Drive:["△",drive],Slides:["▭",slides]};
const FU={Docs:"docs.google.com/document/d/new/edit",Sheets:"docs.google.com/spreadsheets/d/new/edit",Gmail:"mail.google.com/mail/u/0/#inbox",Calendar:"calendar.google.com/calendar/u/0/r/week",Drive:"drive.google.com/drive/my-drive",Slides:"docs.google.com/presentation/d/new/edit"};
const freeBtns=()=>(FA[APP]?`<div class="g">🧪 Explore freely</div>`:"")+Object.keys(FA).filter(k=>k==APP).map(k=>`<button class="tk ${S.free==k?"on":""}" data-f="${k}">${AP[k][2]} ${k}</button>`).join("")+(FA[APP]?`<div class="g">📋 Guided tasks</div>`:"");
function openFree(k){if(!G.fr[k]){G.fr[k]=1;award(5,"Explored "+k);G.nb=[];if(Object.keys(G.fr).length>=1){badge("exp");G.nb.length&&toast("🧭 Badge unlocked: Explorer",1)}}S.free=k;$("#screen").hidden=true;fr.hidden=false;fr.style.setProperty("--c",AP[k][0]);rr();side();$("#url").value=FU[k];$("#url").readOnly=true}
function closeFree(){S.free=null;$("#screen").hidden=false;fr.hidden=true}
/* ===== Gamification: XP, levels, combos, stars, streaks, badges ===== */
const LV=["Novice","Explorer","Practitioner","Skilled","Expert","Certified Educator"];
const BD={first:["🥇","First Steps","Complete your first task"],perf:["💎","Perfectionist","Earn 3 stars on a task"],fast:["⚡","Speedster","Finish a task in under 30 seconds"],str3:["🔥","On Fire","3 mistake-free tasks in a row"],str5:["🌋","Unstoppable","5 mistake-free tasks in a row"],exp:["🧭","Explorer","Try the free-explore mode"],spec:["🎓","App Specialist","Finish every task in one app"],half:["🎯","Halfway There","Complete half of all tasks"],all:["🏆","Certified Educator","Complete every task"]};if(!FA[APP])delete BD.exp;
const fresh=()=>({xp:0,done:{},fr:{},bd:{},streak:0,combo:0,miss:0,hint:0,t0:Date.now(),nb:[]});
let G=fresh();
try{Object.assign(G,JSON.parse(localStorage.getItem("gce_"+APP)||"{}"));G.nb=[]}catch(e){}
const save=()=>{LMS.push();try{localStorage.setItem("gce_"+APP,JSON.stringify({xp:G.xp,done:G.done,fr:G.fr,bd:G.bd,streak:G.streak}))}catch(e){}};
const LMS={a:null,init(){let w=window;for(let i=0;i<10;i++){try{if(w.API){this.a=w.API;break}}catch(e){}if(w.parent===w)break;w=w.parent}
if(!this.a)try{this.a=window.opener&&window.opener.API}catch(e){}
if(!this.a)return;this.a.LMSInitialize("");
try{const sd=this.a.LMSGetValue("cmi.suspend_data");if(sd)Object.assign(G,JSON.parse(sd))}catch(e){}
if(this.a.LMSGetValue("cmi.core.lesson_status")=="not attempted")this.a.LMSSetValue("cmi.core.lesson_status","incomplete")},
push(){const a=this.a;if(!a)return;const n=T.filter(x=>G.done[x.n]).length,p=Math.round(n/T.length*100);
a.LMSSetValue("cmi.core.score.min","0");a.LMSSetValue("cmi.core.score.max","100");a.LMSSetValue("cmi.core.score.raw",String(p));
a.LMSSetValue("cmi.core.lesson_status",n==T.length?"completed":"incomplete");
a.LMSSetValue("cmi.suspend_data",JSON.stringify({xp:G.xp,done:G.done,fr:G.fr,bd:G.bd,streak:G.streak}));a.LMSCommit("")}};
LMS.init();addEventListener("pagehide",()=>{if(LMS.a){LMS.push();LMS.a.LMSFinish("")}});
const lvl=()=>Math.floor(G.xp/150);
function badge(k){if(G.bd[k])return;G.bd[k]=1;G.nb.push(k)}
function award(n,m){const a=lvl();G.xp+=n;const p=document.createElement("div");p.className="xp";p.textContent="+"+n+" XP"+(m?" · "+m:"");document.body.appendChild(p);setTimeout(()=>p.remove(),1400);if(lvl()>a)setTimeout(()=>toast("🎉 Level up! You are now "+LV[Math.min(lvl(),5)],1),700);hud();save()}
function hud(){const l=lvl();$("#hud").innerHTML=`${G.combo>1?`<span class="cb">×${G.combo} combo</span>`:""}<span class="lv">Lv ${l+1} · ${LV[Math.min(l,5)]}</span><span class="xb"><i style="width:${G.xp%150/150*100}%"></i></span><span>${G.xp} XP</span><span title="Mistake-free task streak">🔥 ${G.streak}</span><button id="bdg" class="hb">🏅 ${Object.keys(G.bd).length}/${Object.keys(BD).length}</button>`}
function confetti(){for(let i=0;i<40;i++){const c=document.createElement("i");c.className="cf";c.style.cssText=`left:${Math.random()*100}vw;background:hsl(${Math.random()*360},80%,55%);animation-delay:${Math.random()*.4}s`;document.body.appendChild(c);setTimeout(()=>c.remove(),2500)}}
function finish(){const t=T[S.t],sec=Math.round((Date.now()-G.t0)/1000),first=!G.done[t.n],stars=1+(G.miss?0:1)+(G.hint?0:1),mult=first?1:.25;G.nb=[];
const rows=[["Task complete",40],["Speed bonus ("+sec+"s)",sec<30?25:sec<60?10:0],["No mistakes",G.miss?0:20],["No hints",G.hint?0:15]],tot=Math.round(rows.reduce((a,r)=>a+r[1],0)*mult);
G.streak=G.miss?0:G.streak+1;G.done[t.n]=Math.max(G.done[t.n]||0,stars);S.d[S.t]=G.done[t.n];award(tot);
badge("first");if(stars==3)badge("perf");if(sec<30&&!G.miss)badge("fast");if(G.streak>=3)badge("str3");if(G.streak>=5)badge("str5");
const n=T.filter(x=>G.done[x.n]).length;if(n>=T.length/2)badge("half");if(n==T.length)badge("all");if(T.filter(x=>x.a==t.a).every(x=>G.done[x.n]))badge("spec");save();
const m=document.createElement("div");m.className="win";m.innerHTML=`<div><h2>${"⭐".repeat(stars)}${"☆".repeat(3-stars)}</h2><h3>${E(t.n)}</h3>${rows.filter(r=>r[1]).map(r=>`<p>${r[0]} <b>+${Math.round(r[1]*mult)}</b></p>`).join("")}${mult<1?'<p class="mu">Replay: 25% XP</p>':""}<p class="big">+${tot} XP</p>${G.nb.map(k=>`<p class="bn">${BD[k][0]} <b>${BD[k][1]}</b> unlocked!</p>`).join("")}<button id="nx1">Next task ▶</button><button id="cl1">Close</button></div>`;
document.body.appendChild(m);confetti();m.querySelector("#cl1").onclick=()=>m.remove();m.querySelector("#nx1").onclick=()=>{m.remove();start((S.t+1)%T.length)}}
$("#hud").onclick=e=>{if(!e.target.closest("#bdg"))return;const m=document.createElement("div");m.className="win";m.innerHTML=`<div><h3>Achievements</h3>${Object.keys(BD).map(k=>`<p style="opacity:${G.bd[k]?1:.35}">${BD[k][0]} <b>${BD[k][1]}</b><br><small>${BD[k][2]}</small></p>`).join("")}<button id="cl1">Close</button><button id="rs1">Reset progress</button></div>`;document.body.appendChild(m);
m.querySelector("#cl1").onclick=()=>m.remove();let c=0;const rs=m.querySelector("#rs1");rs.onclick=()=>{if(!c++){rs.textContent="Click again to confirm";return}G=fresh();save();S.d.fill(0);m.remove();hud();side();prog()}};
setInterval(()=>{$("#tm").textContent=S.free||!cur()?"":"⏱ "+Math.round((Date.now()-G.t0)/1000)+"s"},1000);
T.forEach((t,i)=>S.d[i]=G.done[t.n]||0);
hud();start(0);prog();
</script></body></html>
